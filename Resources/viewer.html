<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
:root{--fg:#1f2328;--muted:#59636e;--bg:#fff;--line:#d1d9e0;--code:#f6f8fa;--link:#0969da;--quote:#59636e;--side:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--fg:#e6edf3;--muted:#9198a1;--bg:#0d1117;--line:#3d444d;--code:#151b23;--link:#4493f8;--quote:#9198a1;--side:#010409}}
html{background:var(--bg)}
body{color:var(--fg);background:var(--bg);font:16px/1.7 -apple-system,"PingFang TC","Heiti TC",sans-serif;max-width:900px;margin:0 auto;padding:32px 40px 80px;word-wrap:break-word}
h1,h2,h3,h4{line-height:1.3;margin:1.6em 0 .6em;font-weight:600}
h1{font-size:1.9em;border-bottom:1px solid var(--line);padding-bottom:.3em}
h2{font-size:1.5em;border-bottom:1px solid var(--line);padding-bottom:.3em}
h3{font-size:1.25em}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
p,ul,ol,blockquote,pre,table{margin:0 0 1em}
ul,ol{padding-left:1.8em}li+li{margin-top:.25em}li>ul,li>ol{margin:.25em 0 0}
code{font:.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--code);padding:.15em .35em;border-radius:5px}
pre{background:var(--code);padding:14px 16px;border-radius:8px;overflow:auto;line-height:1.45}pre code{background:none;padding:0}
blockquote{color:var(--quote);border-left:4px solid var(--line);margin-left:0;padding:0 1em}
hr{border:0;border-top:1px solid var(--line);margin:2em 0}
table{border-collapse:collapse;display:block;overflow:auto}
th,td{border:1px solid var(--line);padding:6px 12px}th{background:var(--code);font-weight:600}
img{max-width:100%}
.task-list-item{list-style:none}.task-list-item input{margin:0 .4em 0 -1.4em}
#err{color:#d1242f;white-space:pre-wrap}
#toc{position:fixed;top:0;left:0;bottom:0;width:280px;overflow:auto;border-right:1px solid var(--line);background:var(--side);font-size:14px;line-height:1.5;display:none;box-sizing:border-box;padding-bottom:40px}
#toc .hd{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-weight:600;font-size:15px;background:var(--bg);border-bottom:1px solid var(--line)}
#toc .hd button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px}#toc .hd button:hover{background:var(--code);color:var(--fg)}
#toc .list{padding:10px 10px}
#toc a{display:block;color:var(--muted);padding:6px 8px;border-radius:6px}#toc a:hover{background:var(--code);color:var(--fg);text-decoration:none}
#toc a.l1{font-weight:600;color:var(--fg)}#toc a.l2{padding-left:20px}#toc a.l3,#toc a.l4{padding-left:30px;position:relative}
#toc a.l3::before,#toc a.l4::before{content:"·";position:absolute;left:14px;color:var(--muted)}#toc a.l4{padding-left:44px}#toc a.l4::before{left:28px}
#toc a.cur{background:var(--code);color:var(--link)}
body.side #toc{display:block}body.side{padding-left:320px;max-width:none}
#find{position:fixed;top:10px;right:16px;display:none;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:10;font-size:13px}
#find input{border:1px solid var(--line);border-radius:5px;padding:4px 8px;width:220px;background:var(--bg);color:var(--fg);font-size:14px;outline:none}
#find button{border:0;background:none;color:var(--fg);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:5px}#find button:hover{background:var(--code)}
#find .n{color:var(--muted);min-width:48px;text-align:center}
#help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
#help .box{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.3);padding:18px 22px 20px;width:440px;max-height:80vh;overflow:auto;font-size:14px}
#help .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:16px}
#help .top button{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
#help h4{margin:14px 0 6px;font-size:12px;color:var(--muted);font-weight:600}
#help .row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
#help kbd{font:12px ui-monospace,Menlo,monospace;background:var(--code);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-left:3px}
mark.hit{background:#fff3a3;color:#1f2328;border-radius:2px}mark.hit.on{background:#ff9632}
@media print{#toc,#find,#help{display:none!important}mark.hit{background:none!important}body{padding:0!important;max-width:none}}
</style>
<script src="markdown-it.min.js"></script>
<script src="markdown-it-task-lists.min.js"></script>
</head>
<body>
<nav id="toc"><div class="hd"><span>目錄</span><button title="關閉目錄" onclick="window.webkit.messageHandlers.mdview.postMessage('closeSidebar')">×</button></div><div class="list"></div></nav>
<div id="find"><input id="q" placeholder="尋找…"><span class="n" id="cnt"></span><button title="上一個 ⇧↩" onclick="step(-1)">‹</button><button title="下一個 ↩" onclick="step(1)">›</button><button title="關閉 Esc" onclick="hideFind()">×</button></div>
<div id="help" onclick="if(event.target===this)toggleHelp(false)"><div class="box"><div class="top"><span>快捷鍵說明</span><button onclick="toggleHelp(false)">×</button></div><h4>檔案</h4><div class="row"><span>開啟檔案</span><span><kbd>⌘</kbd><kbd>O</kbd></span></div><div class="row"><span>匯出 PDF</span><span><kbd>⇧</kbd><kbd>⌘</kbd><kbd>E</kbd></span></div><div class="row"><span>列印</span><span><kbd>⌘</kbd><kbd>P</kbd></span></div><div class="row"><span>用文字編輯開啟</span><span><kbd>⌘</kbd><kbd>E</kbd></span></div><div class="row"><span>在 Finder 中顯示</span><span><kbd>⇧</kbd><kbd>⌘</kbd><kbd>R</kbd></span></div><div class="row"><span>關閉視窗</span><span><kbd>⌘</kbd><kbd>W</kbd></span></div><h4>顯示</h4><div class="row"><span>重新載入</span><span><kbd>⌘</kbd><kbd>R</kbd></span></div><div class="row"><span>顯示／隱藏目錄</span><span><kbd>⌃</kbd><kbd>⌘</kbd><kbd>S</kbd></span></div><div class="row"><span>切換主題（系統→淺→深）</span><span><kbd>⇧</kbd><kbd>⌘</kbd><kbd>T</kbd></span></div><div class="row"><span>放大／縮小／實際大小</span><span><kbd>⌘</kbd><kbd>+</kbd> ／ <kbd>⌘</kbd><kbd>-</kbd> ／ <kbd>⌘</kbd><kbd>0</kbd></span></div><div class="row"><span>快捷鍵說明</span><span><kbd>⌘</kbd><kbd>/</kbd></span></div><h4>尋找</h4><div class="row"><span>尋找</span><span><kbd>⌘</kbd><kbd>F</kbd></span></div><div class="row"><span>下一個</span><span><kbd>↩</kbd> 或 <kbd>⌘</kbd><kbd>G</kbd></span></div><div class="row"><span>上一個</span><span><kbd>⇧</kbd><kbd>↩</kbd> 或 <kbd>⇧</kbd><kbd>⌘</kbd><kbd>G</kbd></span></div><div class="row"><span>關閉搜尋列</span><span><kbd>Esc</kbd></span></div><h4>連結</h4><div class="row"><span>網址連結</span><span>交給 Chrome 開啟</span></div><div class="row"><span>相對路徑 .md</span><span>在 MDView 開新視窗</span></div><div class="row"><span>其他本機檔案</span><span>用預設程式開啟</span></div></div></div>
<main id="doc"></main>
<script>
const md = window.markdownit({html: true, linkify: true, typographer: false}).use(window.markdownitTaskLists);
function render(text, keepScroll, baseHref) {
  let b = document.querySelector('base');
  if (!b) { b = document.createElement('base'); document.head.prepend(b); }
  b.href = baseHref;
  const y = keepScroll ? window.scrollY : 0;
  try { document.getElementById('doc').innerHTML = md.render(text); }
  catch (e) { document.getElementById('doc').innerHTML = '<pre id="err"></pre>'; document.getElementById('err').textContent = String(e); }
  buildToc();
  if (document.getElementById('find').style.display === 'flex') search(document.getElementById('q').value);
  const h = document.querySelector('h1');
  if (h) document.title = h.textContent;
  window.scrollTo(0, y);
}
function buildToc() {
  const toc = document.querySelector('#toc .list'); toc.innerHTML = '';
  const used = {};
  document.querySelectorAll('#doc h1,#doc h2,#doc h3,#doc h4').forEach(h => {
    let id = h.id || h.textContent.trim().replace(/\s+/g, '-');
    if (used[id]) id += '-' + (++used[id]); else used[id] = 1;
    h.id = id;
    const a = document.createElement('a');
    a.textContent = h.textContent; a.className = 'l' + h.tagName[1];
    a.onclick = e => { e.preventDefault(); h.scrollIntoView({behavior: 'smooth'}); };
    a.href = '#'; toc.appendChild(a);
  });
}
let hits = [], cur = -1;
function clearHits() { document.querySelectorAll('mark.hit').forEach(m => { const p = m.parentNode; m.replaceWith(m.textContent); p.normalize(); }); hits = []; cur = -1; }
function search(q) {
  clearHits(); const cnt = document.getElementById('cnt');
  if (!q) { cnt.textContent = ''; return; }
  const lq = q.toLowerCase(), w = document.createTreeWalker(document.getElementById('doc'), NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  nodes.forEach(n => {
    let t = n.nodeValue, i, from = 0, frag = null;
    while ((i = t.toLowerCase().indexOf(lq, from)) >= 0) {
      frag = frag || document.createDocumentFragment();
      frag.appendChild(document.createTextNode(t.slice(from, i)));
      const m = document.createElement('mark'); m.className = 'hit'; m.textContent = t.slice(i, i + q.length);
      frag.appendChild(m); hits.push(m); from = i + q.length;
    }
    if (frag) { frag.appendChild(document.createTextNode(t.slice(from))); n.replaceWith(frag); }
  });
  cnt.textContent = hits.length ? '' : '0 筆';
  if (hits.length) step(1);
}
function step(d) {
  if (!hits.length) return;
  if (cur >= 0) hits[cur].classList.remove('on');
  cur = (cur + d + hits.length) % hits.length;
  hits[cur].classList.add('on'); hits[cur].scrollIntoView({block: 'center'});
  document.getElementById('cnt').textContent = (cur + 1) + ' / ' + hits.length;
}
function showFind() { const f = document.getElementById('find'), q = document.getElementById('q'); f.style.display = 'flex'; q.focus(); q.select(); }
function hideFind() { document.getElementById('find').style.display = 'none'; clearHits(); document.getElementById('cnt').textContent = ''; }
document.addEventListener('DOMContentLoaded', () => {
  const q = document.getElementById('q'); let t;
  q.addEventListener('compositionend', () => search(q.value));
  q.addEventListener('input', e => { if (e.isComposing) return; clearTimeout(t); t = setTimeout(() => search(q.value), 150); });
  q.addEventListener('keydown', e => { if (e.isComposing) return; if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); } if (e.key === 'Escape') hideFind(); });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideFind(); toggleHelp(false); } });
function toggleHelp(on) { const h = document.getElementById('help'); h.style.display = (on ?? h.style.display !== 'flex') ? 'flex' : 'none'; }
function toggleSidebar(on) { document.body.classList.toggle('side', on); }
function exportHTML() {
  const c = document.documentElement.cloneNode(true);
  c.querySelectorAll('script,#toc,#find,#help').forEach(n => n.remove());
  c.querySelectorAll('mark.hit').forEach(m => m.replaceWith(m.textContent));
  c.querySelector('body').classList.remove('side');
  return '<!doctype html>\n' + c.outerHTML;
}
</script>
</body>
</html>
